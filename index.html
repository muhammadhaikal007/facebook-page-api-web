<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Page Updates</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1>Facebook Page Updates</h1>

            <p>
                Menampilkan posting terbaru dari
                Page Multimedia API Project
                menggunakan Meta Graph API.
            </p>
        </div>
    </header>


    <main class="container">

        <section class="page-info">

            <div>
                <h2>Page Multimedia API Project</h2>
                <p>Update terbaru dari Facebook Page</p>
            </div>

            <button id="refreshButton">
                Refresh
            </button>

        </section>


        <section id="statusArea">

            <p id="loadingMessage">
                Memuat posting Facebook...
            </p>

            <p id="errorMessage" class="hidden"></p>

            <div id="postsContainer">
                <!-- Posting Facebook akan dimasukkan JavaScript di sini -->
            </div>

        </section>

    </main>


    <footer class="footer">
        <p>
            Implementasi Meta Graph API —
            Tugas Sistem Terintegrasi
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
